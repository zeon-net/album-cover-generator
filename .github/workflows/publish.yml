name: Publish to npm

# Pushing a tag v1.2.3 that matches package.json's version publishes @zeon.net/album-cover-generator.
# It uses npm's trusted publishing: no npm token is stored here. On npmjs.com, the package's settings name this
# repository and this workflow file as its trusted publisher, and npm adds provenance to every release.
# A version that is already on npm is not published again, so the run still passes.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11
      - name: Check the release version
        id: release
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Manual releases must run on main" >&2
            exit 1
          fi
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm; it won't be published again"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - name: Publish to npm
        if: steps.release.outputs.published != 'true'
        run: npm publish --access public
