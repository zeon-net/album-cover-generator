name: Publish to npm

# Publishing a GitHub release (tag v1.2.3, matching package.json's version) publishes @zeon.net/album-cover-generator.
# It uses npm's trusted publishing: no npm token is stored here. On npmjs.com, the package's settings name this
# repository and this workflow file as its trusted publisher, and npm adds provenance to every release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      # prepublishOnly runs the typecheck, the tests and the build before anything is uploaded.
      - run: npm publish
