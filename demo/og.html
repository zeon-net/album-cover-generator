<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The social card (1200 × 630). Not part of the site: screenshot it to demo/public/og-image.jpg (see README). -->
    <title>Social card</title>
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px; height: 630px; overflow: hidden; position: relative;
        background: radial-gradient(circle at 78% 45%, #1b2440 0, transparent 55%), #070b12;
        color: #edf1ff; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 440px; display: flex; flex-direction: column; justify-content: center; }
      .kicker { color: #9aa4ff; font-size: 20px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      h1 { margin: 14px 0 18px; font-size: 64px; line-height: 1.02; letter-spacing: -0.02em; }
      p { margin: 0; color: #b4bfd3; font-size: 25px; line-height: 1.4; }
      .url { margin-top: 30px; color: #edf1ff; font-size: 22px; font-weight: 600; }
      .url span { color: #777df6; }
      #art { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); width: 690px; height: 460px; }
      #art svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 40px #0009); }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="kicker">Free · Open source</div>
      <h1>Album cover generator</h1>
      <p>Retro vinyl records, labels and album covers, designed from a song title.</p>
      <div class="url"><span>↗</span> album-cover-generator.zeon.net</div>
    </div>
    <div id="art"></div>
    <script type="module" src="./og.ts"></script>
  </body>
</html>
